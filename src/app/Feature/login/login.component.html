<div class="login-container">
    <form class="login-form" (ngSubmit)="submit()">
        <h2>Go To Dashboard</h2>

        <input type="text" [(ngModel)]="username" name="username" placeholder="Username" required>

        <div class="password-wrapper">
            <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" name="password"
                placeholder="Password" required>
            <i class="pi" [ngClass]="showPassword ? 'pi-eye-slash' : 'pi-eye'" (click)="togglePassword()"></i>
        </div>

        <button type="submit">Login</button>

        <hr />

        <span class="info">Not an admin? <a [routerLink]="['/']">GO BACK PLEASE!</a></span>
    </form>
</div>
