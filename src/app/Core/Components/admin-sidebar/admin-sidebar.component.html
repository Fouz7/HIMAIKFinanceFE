<div class="sidebar" [ngClass]="{'is-active': sidebarOpen, 'mobile-open': mobileSidebarOpen}">
    <div class="menu">
        <div class="menu-item" (click)="navigate('dashboard')">
            <i class="pi pi-table icon-menu"></i>
            <span *ngIf="sidebarOpen || mobileSidebarOpen">Dashboard</span>
        </div>
        <div class="menu-item" (click)="navigate('income')">
            <i class="pi pi-money-bill icon-menu"></i>
            <span *ngIf="sidebarOpen || mobileSidebarOpen">Income</span>
        </div>
        <div class="menu-item" (click)="navigate('transaction')">
            <i class="pi pi-wallet icon-menu"></i>
            <span *ngIf="sidebarOpen || mobileSidebarOpen">Transaction</span>
        </div>
    </div>
    <div class="menu-bottom">
        <div class="menu-item logout-btn" (click)="logout()">
            <i class="pi pi-sign-out icon-menu"></i>
            <span *ngIf="sidebarOpen || mobileSidebarOpen">Log Out</span>
        </div>
        <button class="toggle-button desktop-only" (click)="toggleSidebar()">
            <i [ngClass]="sidebarOpen ? 'pi pi-arrow-circle-left icon-size' : 'pi pi-arrow-circle-right icon-size'"></i>
        </button>
    </div>
</div>
